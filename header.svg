<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#151a33"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <clipPath id="clip"><rect width="900" height="280" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="900" height="280" fill="url(#bg)"/>

    <!-- floating light orbs behind the glass -->
    <g filter="url(#blur)">
      <circle cx="170" cy="90" r="90" fill="#8b5cf6" opacity="0.85">
        <animateTransform attributeName="transform" type="translate" values="0,0; 60,30; 0,0" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="720" cy="200" r="100" fill="#06b6d4" opacity="0.7">
        <animateTransform attributeName="transform" type="translate" values="0,0; -70,-30; 0,0" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle cx="470" cy="40" r="70" fill="#ec4899" opacity="0.6">
        <animateTransform attributeName="transform" type="translate" values="0,0; 40,50; 0,0" dur="10s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- glass panel -->
  <rect x="40" y="36" width="820" height="208" rx="28" fill="url(#glass)"/>
  <rect x="40.5" y="36.5" width="819" height="207" rx="27.5" stroke="url(#edge)" stroke-width="1.2"/>
  <path d="M68 37.5H832" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1" stroke-linecap="round"/>

  <!-- text -->
  <text x="450" y="118" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="700" fill="url(#name)" letter-spacing="1">Justine Lee</text>
  <text x="450" y="152" text-anchor="middle" font-family="'Malgun Gothic', 'Yu Gothic', 'Segoe UI', sans-serif" font-size="16" fill="#cbd5e1" fill-opacity="0.8" letter-spacing="2">유스티느 리  ·  ジュスティーヌ・リー</text>

  <!-- role chips -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle">
    <rect x="198" y="180" width="150" height="32" rx="16" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="273" y="201">IT Undergraduate</text>

    <rect x="360" y="180" width="190" height="32" rx="16" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="455" y="201">Full-Stack &amp; iOS Developer</text>

    <rect x="562" y="180" width="140" height="32" rx="16" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="632" y="201">UI/UX Designer</text>
  </g>
</svg>
