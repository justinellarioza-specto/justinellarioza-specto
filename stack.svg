<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#151a33"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.28"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <clipPath id="clip"><rect width="900" height="260" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="900" height="260" fill="url(#bg)"/>
    <g filter="url(#blur)">
      <circle cx="120" cy="60" r="80" fill="#8b5cf6" opacity="0.6"/>
      <circle cx="800" cy="210" r="90" fill="#06b6d4" opacity="0.55"/>
    </g>
  </g>

  <rect x="30" y="28" width="840" height="204" rx="26" fill="url(#glass)"/>
  <rect x="30.5" y="28.5" width="839" height="203" rx="25.5" stroke="url(#edge)"/>

  <g font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle">
    <!-- row labels -->
    <g font-size="11" fill="#94a3b8" letter-spacing="3" text-anchor="start">
      <text x="60" y="68">MOBILE</text>
      <text x="60" y="110">FRONTEND</text>
      <text x="60" y="152">BACKEND</text>
      <text x="60" y="194">TOOLS</text>
    </g>

    <!-- mobile -->
    <rect x="190" y="50" width="80" height="30" rx="15" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.25"/><text x="230" y="70">Swift</text>

    <!-- frontend -->
    <rect x="190" y="92" width="110" height="30" rx="15" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.25"/><text x="245" y="112">TypeScript</text>
    <rect x="312" y="92" width="80" height="30" rx="15" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.25"/><text x="352" y="112">Vue 3</text>
    <rect x="404" y="92" width="80" height="30" rx="15" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.25"/><text x="444" y="112">React</text>

    <!-- backend -->
    <rect x="190" y="134" width="90" height="30" rx="15" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.25"/><text x="235" y="154">Node.js</text>
    <rect x="292" y="134" width="90" height="30" rx="15" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.25"/><text x="337" y="154">Express</text>
    <rect x="394" y="134" width="100" height="30" rx="15" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.25"/><text x="444" y="154">MongoDB</text>

    <!-- tools -->
    <rect x="190" y="176" width="70" height="30" rx="15" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.25"/><text x="225" y="196">Git</text>
    <rect x="272" y="176" width="80" height="30" rx="15" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.25"/><text x="312" y="196">Figma</text>
    <rect x="364" y="176" width="80" height="30" rx="15" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.25"/><text x="404" y="196">Linux</text>
    <rect x="456" y="176" width="100" height="30" rx="15" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.25"/><text x="506" y="196">VS Code</text>
  </g>

  <!-- decorative caption on the right -->
  <text x="840" y="140" text-anchor="end" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94a3b8" fill-opacity="0.7" font-style="italic">building things that feel</text>
  <text x="840" y="160" text-anchor="end" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94a3b8" fill-opacity="0.7" font-style="italic">as good as they work.</text>
</svg>
